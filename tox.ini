[tox]
requires = tox>=4
envlist = py312-min, py315-latest, py312-nonumpy

[testenv]
package = wheel
deps =
    pytest
    pytest-cov
    min: numpy==2.5.0
    latest: numpy>=2.5
setenv =
    min: CHAINFIX_TEST_NUMPY = min
    latest: CHAINFIX_TEST_NUMPY = latest
    nonumpy: CHAINFIX_TEST_NUMPY = absent
commands = python -m pytest {posargs:tests} --cov=chainfix --cov-report=xml --cov-report=term-missing
