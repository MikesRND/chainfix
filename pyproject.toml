[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chainfix"
dynamic = ["version"]
authors = [{name = "MikesRND", email = "MikesRND@users.noreply.github.com"}]
description = "Fixed-point data types for signal processing and blockchain applications"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Communications",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Embedded Systems",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]
keywords = [
    "fixed-point",
    "binary fixed-point",
    "decimal fixed-point",
    "dsp",
    "digital signal processing",
    "rf",
    "sdr",
    "wireless communications",
    "fpga",
    "financial",
    "blockchain",
    "defi",
    "smart contracts",
    "solidity",
]

[project.optional-dependencies]
arrays = ["numpy>=2.5"]

[project.urls]
Homepage = "https://github.com/MikesRND/chainfix"
Documentation = "https://github.com/MikesRND/chainfix/tree/main/docs"
Repository = "https://github.com/MikesRND/chainfix"
Issues = "https://github.com/MikesRND/chainfix/issues"
Changelog = "https://github.com/MikesRND/chainfix/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.dynamic]
version = {attr = "chainfix.__version__"}

[tool.coverage.run]
source = ["chainfix"]
branch = true

[tool.coverage.paths]
source = ["src/chainfix", ".tox/*/lib/python*/site-packages/chainfix", "*/site-packages/chainfix"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
