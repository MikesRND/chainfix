---
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    name: "${{ matrix.tox-env }}"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            tox-env: py312-min
            coverage-flag: min
          - python-version: "3.15"
            tox-env: py315-latest
            coverage-flag: latest
          - python-version: "3.12"
            tox-env: py312-nonumpy
            coverage-flag: nonumpy

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"
      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox

      - name: "Run ${{ matrix.tox-env }}"
        run: "tox -e ${{ matrix.tox-env }}"

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./coverage.xml
          flags: ${{ matrix.coverage-flag }}
          name: ${{ matrix.tox-env }}
          fail_ci_if_error: false
          use_oidc: true
